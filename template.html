<title>Find Your Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: matches the printed card. White paper with watercolour florals in the top-right
   and bottom-left corners, gold script names, navy spaced capitals in a light sans, a gold
   serif date, then one phone-width column of cards. Deliberately a single light "paper"
   look in every theme, like the card itself. */
:root {
  color-scheme: light;
  --paper: #FDFDF9;
  --card: #FFFFFF;
  --ink: #1C2038;
  --muted: #5D6175;
  --rule: #E4E2DA;
  --gold: #AD7D22;
  --gold-text: #8A6316;
  --gold-soft: #F6EFDF;
  --font-script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
  --font-serif: "Cormorant Garamond", Garamond, Georgia, serif;
  --font-sans: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --radius: 3px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  position: relative;
  overflow-x: hidden;
  color: var(--ink);
  background: var(--paper);
  font: 400 1rem/1.55 var(--font-sans);
}
button, input { font: inherit; color: inherit; }

/* Watercolour florals from the card */
.floral {
  position: absolute;
  pointer-events: none;
  mix-blend-mode: multiply;
  background-repeat: no-repeat;
  background-size: 100% auto;
}
.floral-top {
  top: 0;
  right: 0;
  width: clamp(170px, 50vw, 400px);
  aspect-ratio: 520 / 517;
  background-image: url("__FLORAL_TOP__");
  background-position: top right;
}
.floral-bottom {
  bottom: 0;
  left: 0;
  width: clamp(160px, 46vw, 360px);
  aspect-ratio: 466 / 598;
  background-image: url("__FLORAL_BOTTOM__");
  background-position: bottom left;
}

.page {
  position: relative;
  max-width: 31rem;
  margin: 0 auto;
  padding-block: 1.5rem clamp(13rem, 62vw, 21rem); /* room for the bottom florals */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 1.5rem;
}
.caps {
  font-family: var(--font-sans);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-variant-numeric: lining-nums;
}

/* Demo note */
.demo {
  font-size: 0.8125rem;
  color: var(--muted);
  border: 1px dashed var(--rule);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.85);
  padding: 0.625rem 0.875rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.375rem 0.5rem;
}
.demo strong { color: var(--ink); font-weight: 500; }
.chip {
  border: 1px solid var(--rule);
  background: var(--card);
  border-radius: 999px;
  padding: 0.0625rem 0.625rem;
  cursor: pointer;
  font-size: 0.8125rem;
}
.chip:hover { border-color: var(--gold); }

/* Card header */
.hero {
  text-align: center;
  display: grid;
  justify-items: center;
  gap: 0.625rem;
  padding-block: clamp(3rem, 16vw, 5rem) 0.25rem;
}
.names {
  margin: 0;
  display: grid;
  justify-items: center;
  font: 400 clamp(3rem, 14vw, 4rem)/1 var(--font-script);
  color: var(--gold);
}
.names .amp {
  font: 300 clamp(1.5rem, 6vw, 1.875rem)/1.4 var(--font-sans);
  color: var(--ink);
}
.date {
  margin: 0.5rem 0 0;
  font: 600 2rem/1 var(--font-serif);
  letter-spacing: 0.12em;
  padding-left: 0.12em; /* balances the trailing letter-spacing */
  color: var(--gold);
  font-variant-numeric: lining-nums;
}
.venue { margin: 0; font-size: 0.75rem; line-height: 1.8; text-wrap: balance; max-width: 20rem; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 1.5rem 1.25rem;
  display: grid;
  gap: 1rem;
  min-width: 0;
  box-shadow: 0 2px 10px rgba(28, 32, 56, 0.05);
}
.card-head { display: grid; gap: 0.375rem; text-align: center; }
.card-head h2 { margin: 0; font-size: 0.9375rem; font-weight: 500; }
.hint { margin: 0; color: var(--muted); font-size: 0.875rem; font-weight: 300; }

.field { position: relative; display: flex; align-items: center; }
.field svg { position: absolute; left: 0.875rem; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#q {
  width: 100%;
  min-width: 0;
  font-size: 1.0625rem;
  padding: 0.8125rem 3rem 0.8125rem 2.625rem;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--paper);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
#q::placeholder { color: #9C9FAE; font-weight: 300; }
#q::-webkit-search-cancel-button { display: none; }
#q:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
#clear {
  position: absolute;
  right: 0.375rem;
  width: 2.5rem; height: 2.5rem;
  border: 0; background: transparent; border-radius: var(--radius);
  color: var(--muted); cursor: pointer; font-size: 1.375rem; line-height: 1;
}
#clear:hover { color: var(--ink); }

.results { list-style: none; margin: 0; padding: 0; display: grid; }
.results li + li { border-top: 1px solid var(--rule); }
.result {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 0.75rem;
  text-align: left;
  padding: 0.75rem 0.5rem;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.result:hover, .result:focus-visible { background: var(--gold-soft); outline: none; }
.result .who { min-width: 0; display: grid; }
.result .name { font-size: 1.0625rem; overflow-wrap: anywhere; }
.result .house { font-size: 0.8125rem; color: var(--muted); font-weight: 300; overflow-wrap: anywhere; }
.pill {
  font-size: 0.6875rem;
  color: var(--gold-text);
  border: 1px solid var(--gold);
  border-radius: 999px;
  padding: 0.25rem 0.625rem;
  white-space: nowrap;
  font-variant-numeric: lining-nums tabular-nums;
}
.empty { margin: 0; color: var(--muted); text-align: center; font-size: 0.9375rem; }

/* Seat view: echoes "will be honored by the presence of ......" */
.seat { text-align: center; justify-items: center; gap: 1.25rem; }
.presence { margin: 0; font-size: 0.75rem; line-height: 1.8; max-width: 18rem; }
.guest {
  margin: -0.5rem 0 0;
  width: 100%;
  padding-bottom: 0.25rem;
  border-bottom: 2px dotted var(--ink);
  font: 400 clamp(2rem, 10vw, 2.625rem)/1.25 var(--font-script);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.tableno { display: grid; justify-items: center; gap: 0.25rem; }
.tableno .caps { font-size: 0.75rem; }
.tableno .num {
  font: 600 5rem/1 var(--font-serif);
  color: var(--gold);
  font-variant-numeric: lining-nums;
}
.tableno .tname { font: 400 2rem/1.1 var(--font-script); color: var(--gold); }

.mates-wrap { width: 100%; display: grid; gap: 0.5rem; }
.mates-head { margin: 0; font-size: 0.75rem; font-weight: 500; }
.mates {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
  gap: 0 1rem;
  text-align: left;
}
.mates li { padding-block: 0.4375rem; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; font-size: 0.9375rem; }

.btn {
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-text);
  border-radius: 999px;
  padding: 0.6875rem 1.5rem;
  font-size: 0.6875rem;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { background: var(--gold-soft); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.foot { text-align: center; font-size: 0.875rem; font-weight: 300; color: var(--muted); margin: 0; }
</style>
<!-- body -->
<div class="floral floral-top" aria-hidden="true"></div>
<div class="floral floral-bottom" aria-hidden="true"></div>
<div class="page">
  <div class="demo" id="demo" hidden>
    <strong>Demo with sample guests.</strong> Try
    <button class="chip" type="button" data-q="perera">perera</button>
    <button class="chip" type="button" data-q="hasini">hasini</button>
    <button class="chip" type="button" data-q="pereira">pereira</button>
    <button class="chip" type="button" data-q="emma clark">emma clark</button>
  </div>

  <header class="hero">
    <h1 class="names" id="names"></h1>
    <p class="date" id="evDate"></p>
    <p class="venue caps" id="evVenue"></p>
  </header>

  <main style="display:grid;gap:1.5rem;min-width:0">
    <section class="card" id="searchView" aria-labelledby="searchTitle">
      <div class="card-head">
        <h2 class="caps" id="searchTitle">Find your table</h2>
        <p class="hint">Start typing your first or last name</p>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Perera" aria-label="Your name" aria-controls="results">
        <button id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <ul class="results" id="results" hidden></ul>
      <p class="empty" id="empty" hidden></p>
    </section>

    <section class="card seat" id="seatView" hidden aria-live="polite">
      <p class="presence caps" id="presence"></p>
      <p class="guest" id="seatName"></p>
      <div class="tableno">
        <span class="caps">Please take your seat at table</span>
        <span class="num" id="seatNum"></span>
        <span class="tname" id="seatTname"></span>
      </div>
      <div class="mates-wrap">
        <h2 class="mates-head caps" id="matesHead">Sharing your table</h2>
        <ul class="mates" id="mates"></ul>
      </div>
      <button class="btn caps" id="back" type="button">Find another guest</button>
    </section>
  </main>

  <p class="foot" id="help"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
const GUESTS = /*GUESTS*/[];
const EVENT = /*EVENT*/{};

const $ = (id) => document.getElementById(id);
const norm = (s) => (s || "")
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/[^a-z0-9\s]/g, " ")
  .replace(/\s+/g, " ").trim();

GUESTS.forEach((g, i) => {
  g.id = i;
  g._name = norm(g.name).split(" ");
  g._all = g._name.concat(norm(g.household).split(" ").filter(Boolean));
});
const TABLES = new Map((EVENT.tables || []).map((t) => [String(t.id), t]));

// Fuzzy matching catches spelling slips ("pereira" -> "Perera"). If the library
// fails to load, the plain prefix search below still works on its own.
const fuse = window.Fuse
  ? new Fuse(GUESTS, {
      keys: [{ name: "name", weight: 2 }, { name: "household", weight: 1 }],
      threshold: 0.34, ignoreLocation: true, minMatchCharLength: 2, ignoreDiacritics: true, includeScore: true,
    })
  : null;

function search(raw) {
  const q = norm(raw);
  if (q.length < 2) return [];
  const words = q.split(" ");
  const starts = (tokens) => words.every((w) => tokens.some((t) => t.startsWith(w)));
  const hits = GUESTS
    .filter((g) => starts(g._all))
    .map((g) => ({ g, rank: starts(g._name) ? 0 : 1 }))
    .sort((a, b) => a.rank - b.rank || a.g.name.localeCompare(b.g.name))
    .map((x) => x.g);
  if (hits.length || !fuse) return hits.slice(0, 8);
  // Nothing typed matches directly: fall back to close spellings only.
  const fuzzy = fuse.search(q, { limit: 8 });
  const cutoff = fuzzy.length ? fuzzy[0].score + 0.12 : 0;
  return fuzzy.filter((r) => r.score <= cutoff).map((r) => r.item);
}

function renderResults() {
  const raw = $("q").value;
  const list = $("results");
  $("clear").hidden = raw.length === 0;
  list.replaceChildren();
  if (norm(raw).length < 2) { list.hidden = true; $("empty").hidden = true; return; }

  const found = search(raw);
  list.hidden = found.length === 0;
  $("empty").hidden = found.length > 0;
  $("empty").textContent = `No guest found for “${raw.trim()}”. Try just your surname, or ask at the welcome desk.`;

  for (const g of found) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "result";
    b.innerHTML = `<span class="who"><span class="name"></span><span class="house"></span></span><span class="pill caps"></span>`;
    b.querySelector(".name").textContent = g.name;
    const house = b.querySelector(".house");
    if (g.household) house.textContent = g.household; else house.remove();
    b.querySelector(".pill").textContent = `Table ${g.table}`;
    b.addEventListener("click", () => showSeat(g));
    li.append(b);
    list.append(li);
  }
}

function showSeat(g) {
  const t = TABLES.get(String(g.table));
  $("seatName").textContent = g.name;
  $("seatNum").textContent = g.table;
  $("seatTname").textContent = t && t.name ? t.name : "";
  $("seatTname").hidden = !(t && t.name);

  const mates = GUESTS.filter((x) => x.table === g.table && x !== g)
    .sort((a, b) => a.name.localeCompare(b.name));
  $("matesHead").textContent = `Sharing your table · ${mates.length + 1} guests`;
  $("mates").replaceChildren(...mates.map((m) => {
    const li = document.createElement("li");
    li.textContent = m.name;
    return li;
  }));

  $("searchView").hidden = true;
  $("seatView").hidden = false;
  window.scrollTo({ top: 0 });
  $("back").focus({ preventScroll: true });
}

function backToSearch() {
  $("seatView").hidden = true;
  $("searchView").hidden = false;
  $("q").value = "";
  renderResults();
  $("q").focus();
}

// Header from event.json, laid out like the invitation
const [first = "", ...rest] = String(EVENT.couple || "").split("&").map((s) => s.trim());
const names = $("names");
const line = (text, cls) => { const s = document.createElement("span"); s.textContent = text; if (cls) s.className = cls; return s; };
names.append(line(first));
if (rest.length) names.append(line("&", "amp"), line(rest.join(" & ")));
names.setAttribute("aria-label", EVENT.couple || "");
$("evDate").textContent = EVENT.date || "";
// Break the venue after its first part, as on the card ("The Victorian, / The Kingsbury, Colombo")
const [venueFirst, ...venueRest] = String(EVENT.venue || "").split(", ");
$("evVenue").append(venueRest.length ? venueFirst + "," : venueFirst);
if (venueRest.length) $("evVenue").append(document.createElement("br"), venueRest.join(", "));
$("help").textContent = EVENT.help || "";
$("presence").textContent = `${EVENT.couple || "We"} will be honored by the presence of`;
$("demo").hidden = !EVENT.demo;
document.querySelectorAll(".floral").forEach((f) => {
  if (!getComputedStyle(f).backgroundImage.includes("data:")) f.hidden = true;
});

$("q").addEventListener("input", renderResults);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const first = $("results").querySelector(".result");
    if (first) first.click();
  }
});
$("clear").addEventListener("click", () => { $("q").value = ""; renderResults(); $("q").focus(); });
$("back").addEventListener("click", backToSearch);
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  if (!$("seatView").hidden) backToSearch();
  $("q").value = c.dataset.q;
  renderResults();
}));
</script>
