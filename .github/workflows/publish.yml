# Rebuilds the table finder from the guest list Google Sheet and publishes it to GitHub Pages.
# Runs every 15 minutes (GitHub may start scheduled runs a few minutes late), on every push,
# and on demand from the Actions tab ("Run workflow"). If the Sheet can't be read or has a
# problem, the run fails and the last published page stays live.
name: Publish table finder

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGE_URL: https://emergingtechexplorer.github.io/sachini-lakshantha/

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Build from the guest list Sheet
        env:
          GUEST_SHEET_ID: ${{ secrets.GUEST_SHEET_ID }}
        run: |
          python3 build.py
          rm -f build/preview.html

      - name: Compare with the live page
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && curl -fsSL "$PAGE_URL" | cmp -s - build/index.html; then
            echo "No seating changes since the last publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
